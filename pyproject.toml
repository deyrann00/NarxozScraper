[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socnetscraper"
version = "0.2.0"
description = "Daily Threads scraper for Narxoz / нархоз mentions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.49.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "schedule>=1.2.2",
  "mcp>=1.9.0",
  "tzdata>=2024.1",
]

[project.scripts]
socnetscraper = "socnetscraper.__main__:main"

[tool.setuptools.packages.find]
include = ["socnetscraper*"]
