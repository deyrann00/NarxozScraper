name: Daily Threads scrape

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium
      - name: Scrape Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python -m socnetscraper scrape
      - name: Upload posts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narxoz-threads-posts
          path: |
            data/posts.jsonl
            data/posts.csv
            data/runs/
            logs/
